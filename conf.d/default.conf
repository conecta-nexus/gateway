# ==============================================================================
# Upstream Definitions for Conecta Nexus Services
# ==============================================================================
upstream auth_upstream {
    server auth:8000;
}

upstream profile_upstream {
    server profile:8000;
}

upstream challenge_upstream {
    server challenge:8000;
}

upstream application_upstream {
    server application:8000;
}

upstream moderation_upstream {
    server moderation:8000;
}

upstream notification_upstream {
    server notification:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

# ==============================================================================
# Gateway Server Block
# ==============================================================================
server {
    listen 80;
    server_name localhost;

    client_max_body_size 25M;

    # Global proxy defaults
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;

    # --------------------------------------------------------------------------
    # Gateway Health Check
    # --------------------------------------------------------------------------
    location /gateway/health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"gateway"}\n';
    }

    # --------------------------------------------------------------------------
    # API Routes (/api/v1/*)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        proxy_pass http://auth_upstream;
    }

    location /api/v1/profile/ {
        proxy_pass http://profile_upstream;
    }

    location ~ ^/api/v1/challenge(s)?/ {
        proxy_pass http://challenge_upstream;
    }

    location ~ ^/api/v1/application(s)?/ {
        proxy_pass http://application_upstream;
    }

    location /api/v1/moderation/ {
        proxy_pass http://moderation_upstream;
    }

    location ~ ^/api/v1/notification(s)?/ {
        proxy_pass http://notification_upstream;
    }

    # --------------------------------------------------------------------------
    # Direct Service Diagnostics & Root Inspection (/services/<service>/)
    # --------------------------------------------------------------------------
    location /services/auth/ {
        proxy_pass http://auth_upstream/;
    }

    location /services/profile/ {
        proxy_pass http://profile_upstream/;
    }

    location /services/challenge/ {
        proxy_pass http://challenge_upstream/;
    }

    location /services/application/ {
        proxy_pass http://application_upstream/;
    }

    location /services/moderation/ {
        proxy_pass http://moderation_upstream/;
    }

    location /services/notification/ {
        proxy_pass http://notification_upstream/;
    }

    # --------------------------------------------------------------------------
    # Frontend (Nuxt 4 / Vue 3) with WebSocket & Vite HMR Support
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
